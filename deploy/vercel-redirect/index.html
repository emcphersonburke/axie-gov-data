<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Axie Community Treasury Dashboard has moved</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- Belt and braces: vercel.json redirects every path before this file is ever served.
         If that config is missing or wrong, this still gets visitors to the right place. -->
    <meta http-equiv="refresh" content="0; url=https://treasury.example.com/" />
    <link rel="canonical" href="https://treasury.example.com/" />
    <style>
      body {
        background: #14161a;
        color: #e8e8e8;
        font:
          16px/1.6 system-ui,
          sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
      }
      a {
        color: #00f5f8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This dashboard has moved</h1>
      <p>
        <a href="https://treasury.example.com/">treasury.example.com</a>
      </p>
    </main>
  </body>
</html>
